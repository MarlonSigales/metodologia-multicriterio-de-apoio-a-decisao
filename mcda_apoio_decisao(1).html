<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCDA-C · Apoio à Decisão</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1d2330;--mut:#667085;--line:#d9dde5;--acc:#1f5fbf;--acc2:#e8f0fc;--ok:#157f3b;--bad:#b42318;--warn:#b54708;--side:#17213a}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
#app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
nav{background:var(--side);color:#cfd6e6;padding:12px 0;position:sticky;top:0;height:100vh;overflow:auto}
nav h1{font-size:15px;color:#fff;margin:4px 16px 12px}
nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#8b96b3;margin:14px 16px 4px}
nav a{display:block;padding:6px 16px;color:#cfd6e6;text-decoration:none;font-size:13px;border-left:3px solid transparent}
nav a:hover{background:#22304f}
nav a.on{background:#22304f;color:#fff;border-left-color:#6aa1ff}
header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header .t{font-weight:600;margin-right:auto}
main{padding:18px 22px 60px;max-width:1400px}
h2{margin:4px 0 6px;font-size:21px}
h3{margin:0 0 8px;font-size:16px}
h4{margin:10px 0 6px;font-size:14px}
.hint{color:var(--mut);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin:0 0 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
.split{display:grid;grid-template-columns:260px 1fr;gap:14px;align-items:start}
label{display:block;font-size:12px;color:var(--mut)}
label input,label textarea,label select{display:block;width:100%;margin-top:3px;font-size:14px;color:var(--ink)}
input,select,textarea{font:inherit;padding:5px 7px;border:1px solid var(--line);border-radius:5px;background:#fff}
input[type=number]{width:90px}
input[type=checkbox]{width:auto}
textarea{min-height:60px;width:100%}
button{font:inherit;padding:5px 11px;border:1px solid var(--line);border-radius:5px;background:#fff;cursor:pointer}
button:hover{background:#f0f2f6}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
button.p:hover{background:#174c9a}
button.s{padding:2px 7px;font-size:12px}
button.x{color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:middle}
th{background:#f7f8fa;font-weight:600;font-size:12px}
td input:not([type=checkbox]),td select{width:100%}
td input[type=number]{width:80px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;background:var(--acc2);color:var(--acc);font-size:12px;margin:1px}
.tag.g{background:#e3f4e8;color:var(--ok)}.tag.r{background:#fde8e6;color:var(--bad)}.tag.o{background:#fff1e0;color:var(--warn)}
.exc{background:#e3f4e8}.cmp{background:#fde8e6}
.list a{display:block;padding:6px 8px;border-radius:5px;text-decoration:none;color:var(--ink);margin-bottom:2px}
.list a:hover{background:#eef2f8}.list a.on{background:var(--acc2);color:var(--acc);font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.scroll{overflow:auto}
.msg{padding:8px 10px;border-radius:6px;margin:8px 0}
.msg.ok{background:#e3f4e8;color:var(--ok)}.msg.bad{background:#fde8e6;color:var(--bad)}.msg.warn{background:#fff1e0;color:var(--warn)}
svg text{font-family:system-ui,sans-serif}
.mapbox{border:1px solid var(--line);border-radius:8px;background:#fbfcfe;overflow:auto;max-height:720px}
.mat td,.mat th{text-align:center;padding:3px}
.mat select{width:auto;min-width:52px}
#flash{position:fixed;right:16px;bottom:14px;background:#17213a;color:#fff;padding:6px 12px;border-radius:6px;opacity:0;transition:opacity .3s;font-size:12px}
@media print{nav,header,button,.noprint{display:none!important}#app{display:block}.card{break-inside:avoid;border:0}}
</style>
</head>
<body>
<div id="app">
<nav id="nav"></nav>
<div>
<header>
<span class="t" id="ptitle">MCDA-C</span>
<button onclick="exportJSON()">⬇ Exportar JSON</button>
<button onclick="$('fimp').click()">⬆ Importar JSON</button>
<input type="file" id="fimp" accept=".json,application/json" style="display:none" onchange="importJSON(this)">
<button onclick="loadExample()">Carregar exemplo (compra do carro)</button>
<button class="x" onclick="novo()">Novo projeto</button>
</header>
<main id="main"></main>
</div>
</div>
<div id="flash">salvo</div>
<script>
'use strict';
/* =========================================================
   MCDA-C (Ensslin, Montibeller & Noronha, 2001) + Roy (1996)
   App local, arquivo único. Estado salvo em localStorage e JSON.
   ========================================================= */
const KEY='mcdac_app_v1';
let S;
const $=id=>document.getElementById(id);
const uid=(p='x')=>p+Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f=(x,d=1)=>x==null||!isFinite(x)?'—':(+x).toFixed(d);
const pn=v=>{const x=parseFloat(String(v).replace(',','.'));return isFinite(x)?x:null};
const opt=(list,cur)=>list.map(([v,l])=>`<option value="${esc(v)}"${String(v)===String(cur??'')?' selected':''}>${esc(l)}</option>`).join('');
const PAL=['#1f5fbf','#d9480f','#2b8a3e','#862e9c','#c2255c','#0b7285','#e67700','#5c940d','#364fc7','#a61e4d'];

function DEF(){return{
 meta:{nome:'Novo projeto',rotulo:'',descricao:'',facilitador:'',data:new Date().toISOString().slice(0,10)},
 atores:[],acoes:[],conjA:{interna:'fixo',externa:'permanente',notas:''},
 problematica:{tipo:'alpha',notas:'',categorias:[],rejeicao:[],usarRejeicao:false},
 epas:[],
 mapa:{conceitos:[],ligacoes:[],clusters:[],ramos:[],autorFiltro:'',clusterFiltro:'',linhaCluster:''},
 arvore:{nos:[{id:'root',pai:null,nome:'Objetivo global',tipo:'raiz',w:1,def:''}],familia:{}},
 indep:{},pesos:{},desempenho:{},
 cb:{custos:[],beneficios:[],pacotes:[]},
 sens:{no:'',pct:10},
 electre:{nivel:'pvf',crit:{},s:0.7,lambda:0.75,perfis:[]},
 recom:{texto:''},
 ui:{page:'projeto',selLeaf:'',selPai:'root',perfilSel:[],faixa:false}
};}
function normalize(o){const d=DEF();for(const k in d){if(o[k]==null)o[k]=d[k];else if(typeof d[k]==='object'&&!Array.isArray(d[k])){for(const kk in d[k])if(o[k][kk]==null)o[k][kk]=d[k][kk];}}
 if(!o.arvore.nos.find(n=>n.id==='root'))o.arvore.nos.unshift({id:'root',pai:null,nome:'Objetivo global',tipo:'raiz',w:1});return o;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));const fl=$('flash');if(fl){fl.style.opacity=1;clearTimeout(save.t);save.t=setTimeout(()=>fl.style.opacity=0,700);}}catch(e){}}
function setP(path,v,rr=true){const k=path.split('.');let o=S;for(let i=0;i<k.length-1;i++){if(o[k[i]]==null)o[k[i]]={};o=o[k[i]];}o[k[k.length-1]]=v;save();if(rr)render();}
function getP(path){return path.split('.').reduce((o,k)=>o==null?undefined:o[k],S);}
function delP(path,i){getP(path).splice(i,1);save();render();}
function movP(path,i,d){const a=getP(path),j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();render();}
function commit(){save();render();}
function go(p){S.ui.page=p;save();render();window.scrollTo(0,0);}

/* ---------------- Árvore ---------------- */
const nos=()=>S.arvore.nos;
const no=id=>nos().find(n=>n.id===id);
const ni=id=>nos().findIndex(n=>n.id===id);
const filhos=id=>nos().filter(n=>n.pai===id);
const isLeaf=n=>n&&n.id!=='root'&&filhos(n.id).length===0;
function dfs(id='root',d=0,out=[]){const n=no(id);if(!n)return out;out.push({n,d});filhos(id).forEach(c=>dfs(c.id,d+1,out));return out;}
const folhas=()=>dfs().map(x=>x.n).filter(isLeaf);
const internos=()=>dfs().map(x=>x.n).filter(n=>filhos(n.id).length>0);
function wn(n,ov){const sib=filhos(n.pai);const W=c=>ov&&ov[c.id]!=null?ov[c.id]:(+c.w||0);const s=sib.reduce((a,c)=>a+W(c),0);return s?W(n)/s:0;}
function gw(id,ov){let n=no(id),w=1;while(n&&n.pai){w*=wn(n,ov);n=no(n.pai);}return w;}
function caminho(id){const r=[];let n=no(id);while(n&&n.pai){r.unshift(n.nome);n=no(n.pai);}return r.join(' › ');}

/* ------------- Descritores e funções de valor ------------- */
function dsc(n){if(!n.dsc)n.dsc={tipo:'quali',classe:'direto',cont:'discreto',unid:'',niveis:[],bom:'',neutro:'',props:{},obs:''};return n.dsc;}
function vfo(n){if(!n.vf)n.vf={metodo:'direta',orig:{},bis:{},mac:{}};return n.vf;}
function transf(n){const d=dsc(n),o=vfo(n).orig;const vb=pn(o[d.bom]),vn=pn(o[d.neutro]);if(!d.bom||!d.neutro||vb==null||vn==null||vb===vn)return null;return{a:100/(vb-vn),b:-100*vn/(vb-vn)};}
function lvVal(n,lid){const t=transf(n);const o=pn(vfo(n).orig[lid]);if(!t||o==null)return null;return t.a*o+t.b;}
const isCont=n=>{const d=dsc(n);return d.tipo==='quanti'&&d.cont==='continuo';};
function ptsQuanti(n){const d=dsc(n),t=transf(n),vf=vfo(n);if(!t)return[];
 let p=d.niveis.filter(l=>pn(l.x)!=null&&pn(vf.orig[l.id])!=null).map(l=>({x:pn(l.x),v:t.a*pn(vf.orig[l.id])+t.b}));
 if(vf.metodo==='bis')[[25,'x25'],[50,'x50'],[75,'x75']].forEach(([q,k])=>{if(pn(vf.bis[k])!=null)p.push({x:pn(vf.bis[k]),v:t.a*q+t.b})});
 return p.sort((a,b)=>a.x-b.x);}
function interp(p,x){if(!p.length)return null;if(x<=p[0].x)return{v:p[0].v,fora:x<p[0].x};const L=p[p.length-1];if(x>=L.x)return{v:L.v,fora:x>L.x};
 for(let i=0;i<p.length-1;i++){const a=p[i],b=p[i+1];if(x>=a.x&&x<=b.x)return{v:b.x===a.x?a.v:a.v+(b.v-a.v)*(x-a.x)/(b.x-a.x),fora:false};}return null;}
function descrOK(n){const d=dsc(n);return d.niveis.length>=2&&d.bom&&d.neutro&&d.bom!==d.neutro;}
function vfOK(n){return descrOK(n)&&!!transf(n)&&dsc(n).niveis.every(l=>pn(vfo(n).orig[l.id])!=null);}
function lvLabel(n,lid){const d=dsc(n);const i=d.niveis.findIndex(l=>l.id===lid);if(i<0)return'—';const l=d.niveis[i];return`N${i+1} ${l.rot||''}`.trim();}

/* ---------------- Desempenho / agregação aditiva ---------------- */
function cell(aid,lid){return(S.desempenho[aid]||{})[lid];}
function vLocal(n,aid,alt=false,ovPerf){const c=ovPerf&&ovPerf.leaf===n.id&&ovPerf.acao===aid?ovPerf.cell:cell(aid,n.id);if(!c)return null;
 if(isCont(n)){const x=pn(alt&&c.x2!=null&&c.x2!==''?c.x2:c.x);if(x==null)return null;const r=interp(ptsQuanti(n),x);return r?r.v:null;}
 const lid=alt&&c.lv2?c.lv2:c.lv;return lid?lvVal(n,lid):null;}
function nodeVal(id,aid,mode='nom',ov=null,ovPerf=null){const n=no(id);const ch=filhos(id);
 if(!ch.length){if(id==='root')return null;if(mode==='nom')return vLocal(n,aid,false,ovPerf);const a=vLocal(n,aid,false,ovPerf),b=vLocal(n,aid,true,ovPerf);if(a==null)return null;return mode==='min'?Math.min(a,b??a):Math.max(a,b??a);}
 let s=0,sw=0;for(const c of ch){const w=ov&&ov[c.id]!=null?ov[c.id]:(+c.w||0);if(w===0){continue;}const v=nodeVal(c.id,aid,mode,ov,ovPerf);if(v==null)return null;s+=w*v;sw+=w;}
 return sw?s/sw:null;}
const V=(aid,mode,ov,op)=>nodeVal('root',aid,mode,ov,op);
function rejeitada(aid){if(!S.problematica.usarRejeicao)return[];const r=[];S.problematica.rejeicao.forEach(q=>{const n=no(q.folha);if(!n)return;const v=nodeVal(n.id,aid);if(v!=null&&pn(q.min)!=null&&v<pn(q.min))r.push(n.nome);});return r;}

/* ---------------- Programação linear (simplex duas fases) ---------------- */
function lpSolve(nv,obj,cons){
 const rows=cons.map(k=>{let a=k.a.slice(),b=k.b,op=k.op;if(b<0){a=a.map(x=>-x);b=-b;op=op==='<='?'>=':op==='>='?'<=':'=';}return{a,b,op};});
 const m=rows.length;let nS=0,nA=0;rows.forEach(r=>{if(r.op!=='=')nS++;if(r.op!=='<=')nA++;});
 const N=nv+nS+nA,T=[],basis=[],art=new Set();let si=nv,ai=nv+nS;
 rows.forEach(r=>{const row=new Array(N+1).fill(0);for(let j=0;j<nv;j++)row[j]=r.a[j]||0;row[N]=r.b;
  if(r.op==='<='){row[si]=1;basis.push(si++);}else if(r.op==='>='){row[si++]=-1;row[ai]=1;art.add(ai);basis.push(ai++);}else{row[ai]=1;art.add(ai);basis.push(ai++);}T.push(row);});
 const pivot=(r,c)=>{const pr=T[r],pv=pr[c];for(let j=0;j<=N;j++)pr[j]/=pv;for(let i=0;i<m;i++)if(i!==r){const k=T[i][c];if(Math.abs(k)>1e-12)for(let j=0;j<=N;j++)T[i][j]-=k*pr[j];}basis[r]=c;};
 const run=(cost,allow)=>{for(let it=0;it<20000;it++){const inB=new Set(basis);let e=-1;
  for(let j=0;j<N;j++){if(!allow(j)||inB.has(j))continue;let rc=cost[j];for(let i=0;i<m;i++)rc-=cost[basis[i]]*T[i][j];if(rc<-1e-9){e=j;break;}}
  if(e<0)return'ok';let lr=-1,best=Infinity;
  for(let i=0;i<m;i++){const a=T[i][e];if(a>1e-9){const q=T[i][N]/a;if(lr<0||q<best-1e-10||(Math.abs(q-best)<=1e-10&&basis[i]<basis[lr])){best=q;lr=i;}}}
  if(lr<0)return'unbounded';pivot(lr,e);}return'iter';};
 const c1=new Array(N).fill(0);art.forEach(j=>c1[j]=1);run(c1,()=>true);
 let inf=0;for(let i=0;i<m;i++)if(art.has(basis[i]))inf+=T[i][N];if(inf>1e-7)return{status:'infeasible'};
 for(let i=0;i<m;i++)if(art.has(basis[i]))for(let j=0;j<nv+nS;j++)if(Math.abs(T[i][j])>1e-9){pivot(i,j);break;}
 const c2=new Array(N).fill(0);for(let j=0;j<nv;j++)c2[j]=obj[j]||0;const st=run(c2,j=>!art.has(j));
 const x=new Array(nv).fill(0);for(let i=0;i<m;i++)if(basis[i]<nv)x[basis[i]]=T[i][N];return{status:st,x};}
/* MACBETH: itens ordenados do melhor (0) ao pior (n-1); J[i][j] (i<j) = categoria 0..6 */
const CATS=[['','—'],['0','nula'],['1','muito fraca'],['2','fraca'],['3','moderada'],['4','forte'],['5','muito forte'],['6','extrema']];
function macbeth(n,J){const pairs=[];for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const k=J[i]&&J[i][j];if(k!==''&&k!=null)pairs.push({i,j,k:+k});}
 const cons=[],row=()=>new Array(n).fill(0);let r=row();r[n-1]=1;cons.push({a:r,op:'=',b:0});
 for(let i=0;i<n-1;i++){r=row();r[i]=1;r[i+1]=-1;cons.push({a:r,op:'>=',b:0});}
 pairs.forEach(p=>{r=row();r[p.i]+=1;r[p.j]-=1;cons.push(p.k===0?{a:r,op:'=',b:0}:{a:r,op:'>=',b:p.k});});
 for(const p of pairs)for(const q of pairs)if(p.k>q.k){r=row();r[p.i]+=1;r[p.j]-=1;r[q.i]-=1;r[q.j]+=1;cons.push({a:r,op:'>=',b:p.k-q.k});}
 const obj=row();obj[0]=1;return{res:lpSolve(n,obj,cons),pairs:pairs.length};}

/* ---------------- Matriz de ordenação (Roberts) ---------------- */
function roberts(ids,mat){const sc={};ids.forEach(i=>sc[i]=0);let miss=0;const viol=[];
 for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){const v=mat[ids[i]+'_'+ids[j]];if(!v){miss++;continue;}if(v==='a')sc[ids[i]]++;else if(v==='b')sc[ids[j]]++;}
 for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){const a=ids[i],b=ids[j],v=mat[a+'_'+b];if(!v)continue;
  if(v==='a'&&!(sc[a]>sc[b]))viol.push([a,b]);if(v==='b'&&!(sc[b]>sc[a]))viol.push([b,a]);if(v==='='&&sc[a]!==sc[b])viol.push([a,b,'=']);}
 const vals=[...new Set(ids.map(i=>sc[i]))].sort((a,b)=>b-a);const groups=vals.map(v=>ids.filter(i=>sc[i]===v));
 return{sc,groups,viol,miss,order:groups.flat()};}
function robertsTable(ids,lab,path,mat){return`<div class="scroll"><table class="mat"><tr><th></th>${ids.map(j=>`<th>${esc(lab(j))}</th>`).join('')}<th>Soma</th></tr>`+
 ids.map((a,i)=>`<tr><th>${esc(lab(a))}</th>${ids.map((b,j)=>{if(i===j)return'<td>—</td>';const k=i<j?a+'_'+b:b+'_'+a;const v=mat[k]||'';let s=v;if(i>j)s=v==='a'?'b':v==='b'?'a':v;
  return`<td>${i<j?`<select onchange="setP('${path}.${k}',this.value)">${opt([['',''],['a','1 (linha ≻)'],['b','0 (coluna ≻)'],['=','0 (=)']],v)}</select>`:`<span style="color:#999">${s==='a'?1:s?0:''}</span>`}</td>`}).join('')}<td class="num"><b>${roberts(ids,mat).sc[a]}</b></td></tr>`).join('')+`</table></div>`;}

/* ---------------- Grafos auxiliares ---------------- */
function tarjan(ids,out){let idx=0;const I={},L={},on={},st=[],res=[];
 const sc=v=>{I[v]=L[v]=idx++;st.push(v);on[v]=1;(out[v]||[]).forEach(w=>{if(I[w]==null){sc(w);L[v]=Math.min(L[v],L[w]);}else if(on[w])L[v]=Math.min(L[v],I[w]);});
  if(L[v]===I[v]){const c=[];let w;do{w=st.pop();on[w]=0;c.push(w);}while(w!==v);res.push(c);}};
 ids.forEach(v=>{if(I[v]==null)sc(v);});return res;}
function nucleo(ids,out){const comps=tarjan(ids,out);const cid={};comps.forEach((c,i)=>c.forEach(v=>cid[v]=i));
 const cout=comps.map(()=>new Set()),cin=comps.map(()=>new Set());ids.forEach(v=>(out[v]||[]).forEach(w=>{if(cid[v]!==cid[w]){cout[cid[v]].add(cid[w]);cin[cid[w]].add(cid[v]);}}));
 const indeg=comps.map((_,i)=>cin[i].size),q=[],topo=[];indeg.forEach((d,i)=>{if(!d)q.push(i);});while(q.length){const c=q.shift();topo.push(c);cout[c].forEach(w=>{if(--indeg[w]===0)q.push(w);});}
 const K=new Set();topo.forEach(c=>{if(![...cin[c]].some(p=>K.has(p)))K.add(c);});return{kernel:[...K].map(c=>comps[c]),ciclos:comps.filter(c=>c.length>1)};}

/* ---------------- Gráficos SVG ---------------- */
function svgWrap(w,h,body){return`<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555"/></marker></defs>${body}</svg>`;}
function barChart(items){const w=640,rh=26,h=items.length*rh+40,L=170,R=w-40;const vals=items.map(i=>i.v).filter(v=>v!=null);
 const mn=Math.min(0,...vals),mx=Math.max(100,...vals);const X=v=>L+(v-mn)/(mx-mn)*(R-L);let b='';
 [0,100].forEach(r=>{b+=`<line x1="${X(r)}" x2="${X(r)}" y1="10" y2="${h-22}" stroke="${r?'#2b8a3e':'#b42318'}" stroke-dasharray="4 3"/><text x="${X(r)}" y="${h-8}" font-size="11" text-anchor="middle" fill="#666">${r?'Bom (100)':'Neutro (0)'}</text>`;});

const conc=id=>S.mapa.conceitos.find(c=>c.id===id);

function depthMap(C,L){const out={};C.forEach(c=>out[c.id]=[]);L.forEach(l=>{if(out[l.de]&&out[l.para])out[l.de].push(l.para);});const memo={},vis={};
 const d=id=>{if(memo[id]!=null)return memo[id];if(vis[id])return 0;vis[id]=1;let m=0;out[id].forEach(t=>m=Math.max(m,1+d(t)));vis[id]=0;memo[id]=m;return m;};C.forEach(c=>d(c.id));return{memo,out};}
function wrap(t,n){const w=String(t||'').split(/\s+/);const L=[];let s='';w.forEach(x=>{if((s+' '+x).trim().length>n){if(s)L.push(s);s=x;}else s=(s+' '+x).trim();});if(s)L.push(s);return L;}
function mapSVG(){const C=mapVisible(),ids=new Set(C.map(c=>c.id));const Ls=S.mapa.ligacoes.filter(l=>ids.has(l.de)&&ids.has(l.para));
 const{memo,out}=depthMap(C,Ls);const byD={};C.forEach(c=>(byD[memo[c.id]]=byD[memo[c.id]]||[]).push(c));const NW=178,NH=64,GX=22,GY=112;const auto={};
 const levels=Object.keys(byD).map(Number).sort((a,b)=>a-b);let maxW=0;
 levels.forEach(dd=>{let arr=byD[dd];if(dd>0)arr=arr.map(c=>{const xs=out[c.id].map(t=>auto[t]&&auto[t].x).filter(x=>x!=null);return[c,xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:1e9];}).sort((a,b)=>a[1]-b[1]).map(z=>z[0]);
  arr.forEach((c,i)=>auto[c.id]={x:20+NW/2+i*(NW+GX),y:30+NH/2+dd*GY});maxW=Math.max(maxW,arr.length);});
 mapVB=[Math.max(700,maxW*(NW+GX)+40),Math.max(300,levels.length*GY+60)];
 mapPos={};C.forEach(c=>mapPos[c.id]=c.x!=null?{x:c.x,y:c.y}:auto[c.id]);
 const col=id=>{const c=conc(id);const k=S.mapa.clusters.find(k=>k.id===c.cluster);return k?k.cor:'#6b7a99';};let b='';
 Ls.forEach(l=>{const a=mapPos[l.de],t=mapPos[l.para];if(!a||!t)return;const cp=(x,y,tx,ty)=>{const dx=tx-x,dy=ty-y;const s=Math.min(dx?(NW/2)/Math.abs(dx):1e9,dy?(NH/2)/Math.abs(dy):1e9);return[x+dx*s,y+dy*s];};
  const p1=cp(a.x,a.y,t.x,t.y),p2=cp(t.x,t.y,a.x,a.y);b+=`<line x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}" stroke="${l.sinal<0?'#b42318':'#555'}" stroke-width="1.6" marker-end="url(#ar)"/>`;
  if(l.sinal<0)b+=`<circle cx="${(p1[0]+p2[0])/2}" cy="${(p1[1]+p2[1])/2}" r="8" fill="#fff" stroke="#b42318"/><text x="${(p1[0]+p2[0])/2}" y="${(p1[1]+p2[1])/2+4}" text-anchor="middle" font-size="13" fill="#b42318" font-weight="700">−</text>`;});
 C.forEach(c=>{const p=mapPos[c.id];const l1=wrap(c.num+'. '+c.pres,30).slice(0,3),l2=wrap('... '+(c.opos||'?'),32).slice(0,1);
  b+=`<g style="cursor:move" onmousedown="dragStart(event,'${c.id}')"><rect x="${p.x-NW/2}" y="${p.y-NH/2}" width="${NW}" height="${NH}" rx="8" fill="#fff" stroke="${col(c.id)}" stroke-width="2"/>`+
  l1.map((t,i)=>`<text x="${p.x}" y="${p.y-NH/2+15+i*13}" text-anchor="middle" font-size="11">${esc(t)}</text>`).join('')+l2.map(t=>`<text x="${p.x}" y="${p.y+NH/2-7}" text-anchor="middle" font-size="10" fill="#888">${esc(t)}</text>`).join('')+'</g>';});
 return`<svg id="mapsvg" viewBox="0 0 ${mapVB[0]} ${mapVB[1]}" width="${mapVB[0]}" height="${mapVB[1]}" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#555"/></marker></defs><text x="10" y="16" font-size="11" fill="#888">↑ fins (valores)</text><text x="10" y="${mapVB[1]-8}" font-size="11" fill="#888">↓ meios (ações)</text>${b}</svg>`;}
function svgPt(svg,e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse());}
function dragStart(e,id){e.preventDefault();const p=svgPt($('mapsvg'),e);const pos=mapPos[id];drag={id,dx:p.x-pos.x,dy:p.y-pos.y};}
if(typeof window!=='undefined'){window.addEventListener('mousemove',e=>{if(!drag||!$('mapsvg'))return;const p=svgPt($('mapsvg'),e);const c=conc(drag.id);c.x=p.x-drag.dx;c.y=p.y-drag.dy;$('mapbox').innerHTML=mapSVG();});

function addRel(id,dir){const c=conc(id);const q=dir==='fim'?`Por que "${c.pres}" é importante? (conceito FIM — pólo presente)`:`Como obter "${c.pres}"? (conceito MEIO — pólo presente)`;
 const pres=prompt(q);if(!pres)return;const opos=prompt('Pólo oposto psicológico (o oposto na visão do decisor):')||'';const pos=confirm('A influência é POSITIVA? (OK = +, Cancelar = −)');
 const num=Math.max(0,...S.mapa.conceitos.map(c=>c.num||0))+1;const n={id:uid('k'),num,pres,opos,autor:c.autor,cluster:c.cluster};S.mapa.conceitos.push(n);
 S.mapa.ligacoes.push(dir==='fim'?{id:uid('l'),de:id,para:n.id,sinal:pos?1:-1}:{id:uid('l'),de:n.id,para:id,sinal:pos?1:-1});commit();}
function unir(){const a=$('un_a').value,b=$('un_b').value;if(!a||!b||a===b)return alert('Escolha dois conceitos diferentes.');if(!confirm(`Unir ${cLab(b)} em ${cLab(a)}? As ligações de ${cLab(b)} passarão para ${cLab(a)}.`))return;
 S.mapa.ligacoes.forEach(l=>{if(l.de===b)l.de=a;if(l.para===b)l.para=a;});const seen=new Set();S.mapa.ligacoes=S.mapa.ligacoes.filter(l=>{const k=l.de+'>'+l.para;if(l.de===l.para||seen.has(k))return false;seen.add(k);return true;});
 S.mapa.conceitos=S.mapa.conceitos.filter(c=>c.id!==b);S.mapa.ramos.forEach(r=>r.conceitos=[...new Set(r.conceitos.map(x=>x===b?a:x))]);commit();}
P.mapa=()=>{const m=S.mapa,co=m.conceitos.map(c=>[c.id,'C'+c.num+' '+(c.pres||'').slice(0,40)]);return`<h2>6. Mapa cognitivo (mapas individuais → agregado → congregado)</h2>

<button onclick="S.mapa.clusters.push({id:uid('g'),nome:'Cluster '+(S.mapa.clusters.length+1),cor:PAL[S.mapa.clusters.length%PAL.length]});commit()">+ Cluster</button></div></div>`;};

function mapaGraph(filtro){const C=S.mapa.conceitos.filter(c=>!filtro||c.cluster===filtro||!c.cluster&&false),ids=new Set(C.map(c=>c.id));const out={},inn={};C.forEach(c=>{out[c.id]=[];inn[c.id]=[];});
 S.mapa.ligacoes.forEach(l=>{if(ids.has(l.de)&&ids.has(l.para)){out[l.de].push(l.para);inn[l.para].push(l.de);}});return{C,out,inn};}
function linhas(g){const tails=g.C.filter(c=>!g.inn[c.id].length&&g.out[c.id].length).map(c=>c.id);const res=[];
 const rec=(v,path)=>{if(res.length>400)return;if(!g.out[v].length){res.push(path.slice());return;}g.out[v].forEach(w=>{if(!path.includes(w)){path.push(w);rec(w,path);path.pop();}});};tails.forEach(t=>rec(t,[t]));return res;}
function addLinhaRamo(rid,ids){if(!rid)return;const ids2=ids.split(',');if(rid==='__novo'){S.mapa.ramos.push({id:uid('r'),nome:'Ramo '+(S.mapa.ramos.length+1),conceitos:ids2,l1:'',l2:'',l3:'',essencial:false,controlavel:false,pvf:'',paiPvf:'root'});}else{const r=S.mapa.ramos.find(r=>r.id===rid);r.conceitos=[...new Set([...r.conceitos,...ids2])];}commit();}

 const n={id:uid('n'),pai:r.paiPvf||'root',nome:r.pvf||(r.l2?conc(r.l2).pres:'PVF'),tipo:'PVF',w:1,def:r.l3?'Ações potenciais: '+r.l3:'',essencial:r.essencial,controlavel:r.controlavel,ramo:r.id};nos().push(n);r.no=n.id;commit();}
P.analise=()=>{const g=mapaGraph('');const heads=g.C.filter(c=>!g.out[c.id].length&&g.inn[c.id].length),tails=g.C.filter(c=>!g.inn[c.id].length&&g.out[c.id].length),iso=g.C.filter(c=>!g.out[c.id].length&&!g.inn[c.id].length);
 const comps=tarjan(g.C.map(c=>c.id),g.out).filter(c=>c.length>1);const lc=S.mapa.linhaCluster;const gl=lc?mapaGraph(lc):g;const LN=linhas(gl);const dm=depthMap(S.mapa.conceitos,S.mapa.ligacoes).memo;
 const chip=id=>`<span class="tag" title="${esc((conc(id)||{}).pres)}">${cLab(id)}</span>`;
 return`<h2>7. Análise do mapa cognitivo · Ramos · Enquadramento</h2>
<p class="hint">Análise tradicional (forma): cabeças (fins estratégicos), rabos (meios/ações), laços de realimentação e clusters. Análise avançada (forma + conteúdo): linhas de argumentação → ramos → enquadramento (L1 objetivos estratégicos, L2 PVF essencial e controlável, L3 ações potenciais).</p>

 return`<div class="card"><div class="row"><input style="font-weight:600;width:240px" value="${esc(r.nome)}" onchange="setP('mapa.ramos.${i}.nome',this.value)"><button class="s x" onclick="delP('mapa.ramos',${i})">Excluir ramo</button></div>
 <div class="grid2"><div><h4>Conceitos (fins no topo)</h4>${cs.map(id=>`<div class="row" style="margin:2px 0">${id===r.l1?'<span class="tag g">L1</span>':''}${id===r.l2?'<span class="tag o">L2</span>':''}${chip(id)} ${esc(conc(id).pres)} <button class="s x" onclick="S.mapa.ramos[${i}].conceitos=S.mapa.ramos[${i}].conceitos.filter(x=>x!=='${id}');commit()">✕</button></div>`).join('')}<div class="hint">L3 (ações potenciais) — abaixo dos rabos: ${esc(r.l3||'—')}</div></div>
 <div><label>L1 · conceito que expressa o objetivo estratégico<select onchange="setP('mapa.ramos.${i}.l1',this.value)">${opt([['','—'],...o],r.l1)}</select></label>

const PROPS_FAM=[['essencial','Essencial — aspectos de importância fundamental segundo os valores dos decisores'],['controlavel','Controlável — influenciado apenas pelas ações potenciais em questão'],['completo','Completo — ações iguais em todos os PVFs são indiferentes'],['mensuravel','Mensurável — desempenho especificado com mínima ambiguidade'],['operacional','Operacional — informações coletáveis no tempo e esforço viáveis'],['isolavel','Isolável — independência preferencial (ver página 10)'],['naoredundante','Não-redundante — cada aspecto considerado uma única vez'],['conciso','Conciso — número mínimo de aspectos necessário'],['compreensivel','Compreensível — significado claro, permite comunicação']];
function addNo(pai){nos().push({id:uid('n'),pai,nome:'Novo ponto de vista',tipo:pai==='root'?'PVF':'PVE',w:1,def:''});commit();}
function delNo(id){if(!confirm('Excluir o nó e todos os descendentes?'))return;const k=new Set();const rec=i=>{k.add(i);filhos(i).forEach(c=>rec(c.id));};rec(id);S.arvore.nos=nos().filter(n=>!k.has(n.id));commit();}

function treeSVG(){const lv=folhas();if(!lv.length)return'';const pos={};const W=150,H=46,GX=12,GY=86;lv.forEach((n,i)=>pos[n.id]={x:10+W/2+i*(W+GX)});
 const X=id=>{if(pos[id]&&pos[id].x!=null)return pos[id].x;const ch=filhos(id);const x=ch.map(c=>X(c.id)).reduce((a,b)=>a+b,0)/ch.length;pos[id]={x};return x;};X('root');
 let md=0;dfs().forEach(({n,d})=>{pos[n.id].y=20+H/2+d*GY;md=Math.max(md,d);});const w=Math.max(500,lv.length*(W+GX)+20),h=(md+1)*GY+20;let b='';
 nos().forEach(n=>{if(n.pai&&pos[n.id]&&pos[n.pai])b+=`<path d="M${pos[n.pai].x} ${pos[n.pai].y+H/2} V${(pos[n.pai].y+pos[n.id].y)/2} H${pos[n.id].x} V${pos[n.id].y-H/2}" fill="none" stroke="#aaa"/>`;});
 dfs().forEach(({n})=>{const p=pos[n.id];const c=n.tipo==='area'?'#fff1e0':n.tipo==='PVF'?'#e8f0fc':n.tipo==='raiz'?'#17213a':'#f3f4f6';const tc=n.tipo==='raiz'?'#fff':'#1d2330';
  b+=`<rect x="${p.x-W/2}" y="${p.y-H/2}" width="${W}" height="${H}" rx="6" fill="${c}" stroke="#9aa4b8"/>`+wrap(n.nome,24).slice(0,2).map((t,i)=>`<text x="${p.x}" y="${p.y-6+i*13}" text-anchor="middle" font-size="11" fill="${tc}">${esc(t)}</text>`).join('')+(n.pai?`<text x="${p.x}" y="${p.y+19}" text-anchor="middle" font-size="10" fill="#1f5fbf">${f(wn(n)*100,1)}% · g ${f(gw(n.id)*100,1)}%</text>`:'');});
 return`<div class="scroll">${svgWrap(w,h,b).replace('width="100%"',`width="${w}"`)}</div>`;}
P.arvore=()=>{const fam=S.arvore.familia;return`<h2>8. Árvore de pontos de vista (família de PVFs e PVEs)</h2>

function delNivel(id,k){const d=dsc(no(id));const l=d.niveis[k];d.niveis.splice(k,1);if(d.bom===l.id)d.bom='';if(d.neutro===l.id)d.neutro='';commit();}
function genQ(id){const d=dsc(no(id));const a=pn($('gq_min').value),b=pn($('gq_max').value),n=parseInt($('gq_n').value),dir=$('gq_dir').value;if(a==null||b==null||!(n>=2))return alert('Informe mínimo, máximo e nº de níveis (≥2).');
 if(d.niveis.length&&!confirm('Substituir os níveis existentes?'))return;d.niveis=[];for(let k=0;k<n;k++){const v=a+(b-a)*k/(n-1);const x=+(dir==='max'?v:b-(b-a)*k/(n-1)).toFixed(6);d.niveis.push({id:uid('l'),rot:`${x} ${d.unid||''}`.trim(),desc:'',x});}d.bom='';d.neutro='';commit();}
function genComb(id){const d=dsc(no(id));const g=d.gen;let combs=[[]];g.dims.forEach(dm=>{const st=dm.estados.split(';').map(s=>s.trim()).filter(Boolean);const nc=[];combs.forEach(c=>st.forEach(s=>nc.push([...c,s])));combs=nc;});
 if(combs.length>60)return alert('Mais de 60 combinações — reduza os estados.');g.comb=combs.map((c,i)=>({id:'c'+i,rot:c.map((s,k)=>g.dims[k].nome+': '+s).join(' + '),inad:false}));g.mat={};commit();}
function genNiveis(id){const d=dsc(no(id)),g=d.gen;const ids=g.comb.filter(c=>!c.inad).map(c=>c.id);const r=roberts(ids,g.mat);if(r.miss)return alert('Complete a matriz de ordenação.');if(r.viol.length&&!confirm('Há intransitividades. Gerar mesmo assim?'))return;
 if(d.niveis.length&&!confirm('Substituir os níveis existentes?'))return;const lab=i=>g.comb.find(c=>c.id===i).rot;d.niveis=r.groups.slice().reverse().map(gr=>({id:uid('l'),rot:'',desc:gr.map(lab).join(' | ou | '),x:''}));d.niveis.forEach((l,k)=>l.rot='N'+(k+1));d.bom='';d.neutro='';commit();}
P.descritores=()=>{const L=folhas();const n=no(S.ui.selLeaf);if(!n)return`<h2>9. Descritores</h2>${selLeafList()}`;const d=dsc(n),i=ni(n.id),base=`arvore.nos.${i}.dsc`;const rev=d.niveis.map((l,k)=>[l,k]).reverse();
 const g=d.gen||{dims:[],comb:[],mat:{}};const adm=g.comb.filter(c=>!c.inad).map(c=>c.id);const rb=adm.length?roberts(adm,g.mat):null;
 return`<h2>9. Descritores</h2><p class="hint">Descritor = conjunto de níveis de impacto, ordenados por preferência, que descrevem as performances plausíveis das ações em cada PVF/PVE (cerca de 5 níveis; melhor viável e pior admissível nos extremos). Defina os níveis de referência <b>Bom</b> e <b>Neutro</b>.</p>

function nivelTxt(n,which){if(!isLeaf(n))return which==='bom'?'Bom':'Neutro';const d=dsc(n);const id=which==='bom'?d.bom:d.neutro;return id?lvLabel(n,id):which;}
P.indep=()=>{const grupos=internos().filter(p=>filhos(p.id).length>=2);const SEL=[['','não testado'],['s','sim'],['n','não']];
 return`<h2>10. Independência preferencial mútua</h2><p class="hint">Necessária para a agregação aditiva. Teste ordinal: a ordem de preferência entre dois níveis de A se mantém qualquer que seja o nível de B? Teste cardinal: a diferença de atratividade entre esses níveis de A não depende de B? Faça nos dois sentidos. Se falhar, agrupe os PVs num descritor construído (Anexo 7A).</p>
${grupos.map(p=>{const ch=filhos(p.id);let rows='';for(let a=0;a<ch.length;a++)for(let b=a+1;b<ch.length;b++){const A=ch[a],B=ch[b],k=A.id+'_'+B.id,t=S.indep[k]||{};const st=['oAB','oBA','cAB','cBA'].map(x=>t[x]);
 const res=st.includes('n')?'<span class="tag r">dependentes</span>':st.every(x=>x==='s')?'<span class="tag g">mutuamente independentes</span>':'<span class="tag o">incompleto</span>';
 rows+=`<tr><td><b>${esc(A.nome)}</b> × <b>${esc(B.nome)}</b><div class="hint" style="font-size:11px">Ex.: com ${esc(B.nome)} em “${esc(nivelTxt(B,'neutro'))}” e depois em “${esc(nivelTxt(B,'bom'))}”, “${esc(nivelTxt(A,'bom'))}” continua preferível a “${esc(nivelTxt(A,'neutro'))}” em ${esc(A.nome)}? E a diferença de atratividade é a mesma?</div></td>
 ${['oAB','oBA','cAB','cBA'].map(x=>`<td><select onchange="setP('indep.${k}.${x}',this.value)">${opt(SEL,t[x])}</select></td>`).join('')}<td>${res}</td></tr>`;}
 return`<div class="card"><h3>Sob “${esc(p.nome)}”</h3><table><tr><th>Par</th><th>Ordinal A|B</th><th>Ordinal B|A</th><th>Cardinal A|B</th><th>Cardinal B|A</th><th>Resultado</th></tr>${rows}</table></div>`;}).join('')||'<p class="hint">Sem grupos com 2+ irmãos.</p>'}`;};

/* ---------------- 11. Funções de valor ---------------- */
function calcBis(id){const n=no(id),d=dsc(n),vf=vfo(n);if(d.niveis.length<2)return;const w=d.niveis[0],b=d.niveis[d.niveis.length-1];const xw=pn(w.x),xb=pn(b.x);if(xw==null||xb==null)return alert('Níveis sem valor numérico.');
 const p=[{x:xw,v:0},{x:xb,v:100}];[['x25',25],['x50',50],['x75',75]].forEach(([k,q])=>{if(pn(vf.bis[k])!=null)p.push({x:pn(vf.bis[k]),v:q});});p.sort((a,c)=>a.x-c.x);
 d.niveis.forEach(l=>{const r=interp(p,pn(l.x));vf.orig[l.id]=r?+r.v.toFixed(3):null;});commit();}
function calcMacVF(id){const n=no(id),d=dsc(n),vf=vfo(n);const items=d.niveis.slice().reverse();const J=items.map((a,i)=>items.map((b,j)=>i<j?vf.mac[a.id+'_'+b.id]:null));
 const{res}=macbeth(items.length,J);if(res.status!=='ok'){alert(res.status==='infeasible'?'Julgamentos inconsistentes: não existe escala compatível. Revise a matriz (ex.: diferenças maiores devem ter categorias maiores).':'Falha no PL: '+res.status);return;}
 const top=res.x[0]||1;items.forEach((l,i)=>vf.orig[l.id]=+(res.x[i]/top*100).toFixed(3));vf.macRaw=res.x.slice();commit();}
function macMatrix(items,path,mat,lab){return`<div class="scroll"><table class="mat"><tr><th></th>${items.map(x=>`<th>${esc(lab(x))}</th>`).join('')}</tr>${items.map((a,i)=>`<tr><th>${esc(lab(a))}</th>${items.map((b,j)=>i<j?`<td><select onchange="setP('${path}.${a.id}_${b.id}',this.value)">${opt(CATS,mat[a.id+'_'+b.id])}</select></td>`:i===j?'<td>—</td>':'<td></td>').join('')}</tr>`).join('')}</table></div>`;}
P.funcoes=()=>{const n=no(S.ui.selLeaf);if(!n)return`<h2>11. Funções de valor</h2>${selLeafList('funcoes')}`;const d=dsc(n),vf=vfo(n),i=ni(n.id),base=`arvore.nos.${i}.vf`,t=transf(n);const rev=d.niveis.slice().reverse();
 const origs=d.niveis.map(l=>pn(vf.orig[l.id]));const mono=origs.every((v,k)=>v==null||!k||origs[k-1]==null||v>=origs[k-1]);
 let chart='';if(t){if(isCont(n)){const p=ptsQuanti(n);chart=lineChart(p.map(q=>String(+q.x.toFixed(3))),[{n:'v(x)',y:p.map(q=>q.v)}]);}else chart=barChart(d.niveis.map((l,k)=>({l:'N'+(k+1)+' '+(l.rot||''),v:lvVal(n,l.id)})));}
 return`<h2>11. Funções de valor</h2><p class="hint">A função de valor transforma o descritor (escala ordinal) em escala de intervalos que reflete as diferenças de atratividade. Depois, transformação linear positiva ancora <b>Neutro = 0</b> e <b>Bom = 100</b> (Ensslin, 8.4). Não interprete razões de valores (escala de intervalos!), apenas razões de diferenças.</p>

</div></div>`;};

/* ---------------- 12. Taxas de substituição ---------------- */
function pz(pid){if(!S.pesos[pid])S.pesos[pid]={metodo:'direto',ord:{},swing:{},trade:{ref:'',v:{}},mac:{}};return S.pesos[pid];}
function saltoTxt(c){let l=c;if(!isLeaf(c)){const ls=dfs(c.id).map(x=>x.n).filter(isLeaf);if(!ls.length)return'—';l=ls.reduce((a,b)=>gw(b.id)>gw(a.id)?b:a);}const d=dsc(l);return`${isLeaf(c)?'':esc(l.nome)+': '}${esc(nivelTxt(l,'neutro'))} → ${esc(nivelTxt(l,'bom'))}`;}
function ordemFilhos(pid){const ch=filhos(pid).map(c=>c.id);const r=roberts(ch,pz(pid).ord);return r.miss||r.viol.length?ch:r.order;}
function calcPesos(pid){const pp=pz(pid),ch=filhos(pid);let w={};
 if(pp.metodo==='direto'){ch.forEach(c=>w[c.id]=+c.w||0);}
 if(pp.metodo==='swing'){ch.forEach(c=>w[c.id]=pn(pp.swing[c.id])||0);}
 if(pp.metodo==='trade'){if(!pp.trade.ref)return alert('Escolha o critério de referência.');ch.forEach(c=>w[c.id]=c.id===pp.trade.ref?1:(pn(pp.trade.v[c.id])||0)/100);}
 if(pp.metodo==='mac'){const ord=ordemFilhos(pid);const items=[...ord,'A0'];const J=items.map((a,i)=>items.map((b,j)=>i<j?pp.mac[a+'_'+b]:null));const{res}=macbeth(items.length,J);
  if(res.status!=='ok')return alert(res.status==='infeasible'?'Julgamentos inconsistentes: revise a matriz.':'Falha no PL.');ord.forEach((c,i)=>w[c]=res.x[i]);}
 const s=Object.values(w).reduce((a,b)=>a+b,0);if(!s)return alert('Soma nula.');ch.forEach(c=>c.w=+(w[c.id]/s).toFixed(4));commit();}
P.pesos=()=>{const I=internos();if(!I.find(n=>n.id===S.ui.selPai))S.ui.selPai=I[0]?I[0].id:'root';const pid=S.ui.selPai,p=no(pid);if(!p||!filhos(pid).length)return`<h2>12. Taxas de substituição</h2><p class="hint">Construa a árvore primeiro.</p>`;
 const ch=filhos(pid),pp=pz(pid),base=`pesos.${pid}`,rb=roberts(ch.map(c=>c.id),pp.ord);const sw=ch.reduce((a,c)=>a+(+c.w||0),0);
 return`<h2>12. Taxas de substituição</h2><p class="hint">Taxas de substituição expressam a compensação entre critérios (quanto se aceita perder num para ganhar noutro) e são obtidas sobre os saltos Neutro→Bom — <b>não</b> são “importância” dos nomes dos critérios. Determine de baixo para cima e entre critérios do mesmo nível.</p>
<div class="split"><div class="card list">${I.map(n=>`<a href="#" class="${n.id===pid?'on':''}" onclick="S.ui.selPai='${n.id}';commit();return false">${esc(n.nome)}<br><small style="color:#888">${filhos(n.id).length} filhos</small></a>`).join('')}</div><div>
<div class="card"><h3>Filhos de “${esc(p.nome)}”</h3><table><tr><th>Critério</th><th>Salto Neutro → Bom</th><th>Taxa local</th><th>Global</th></tr>${ch.map(c=>`<tr><td>${esc(c.nome)}</td><td style="font-size:12px">${saltoTxt(c)}</td><td class="num">${pp.metodo==='direto'?`<input type="number" step="0.01" value="${c.w}" onchange="setP('arvore.nos.${ni(c.id)}.w',pn(this.value))">`:f(wn(c)*100,1)+'%'}</td><td class="num">${f(gw(c.id)*100,2)}%</td></tr>`).join('')}</table>
${Math.abs(sw-1)>0.001?`<div class="hint">Soma = ${f(sw,4)} (normalizada automaticamente).</div>`:''}</div>
<div class="card"><h3>Ordenação dos critérios (matriz de Roberts)</h3><p class="hint">Qual ação é preferível: a com o critério da linha em Bom (demais em Neutro) ou a com o critério da coluna em Bom?</p>${robertsTable(ch.map(c=>c.id),id=>no(id).nome,base+'.ord',pp.ord)}
${rb.miss?'':rb.viol.length?'<div class="msg bad">Intransitividade — revise os julgamentos.</div>':`<div class="row"><b>Ordem:</b> ${rb.groups.map((g,k)=>`<span class="tag">${k+1}º ${g.map(x=>esc(no(x).nome)).join(' = ')}</span>`).join('')}</div>`}</div>
<div class="card"><div class="row"><b>Método:</b>${[['direto','Direto'],['swing','Swing weights'],['trade','Trade-off'],['mac','Comparação par-a-par (MACBETH)']].map(([k,l])=>`<label style="color:var(--ink);display:inline"><input type="radio" name="pm" ${pp.metodo===k?'checked':''} onchange="setP('${base}.metodo','${k}')"> ${l}</label>`).join(' ')}</div>
${pp.metodo==='swing'?`<p class="hint">Parta de uma ação com todos os critérios em Neutro. Qual salto para Bom é preferido? Ele vale 100. Quanto valem os outros saltos em relação a esse?</p><table>${ordemFilhos(pid).map(id=>`<tr><td>${esc(no(id).nome)}</td><td>${saltoTxt(no(id))}</td><td><input type="number" value="${pp.swing[id]??''}" onchange="setP('${base}.swing.${id}',pn(this.value),false)"> pontos</td></tr>`).join('')}</table>`:''}
${pp.metodo==='trade'?`<p class="hint">Ação A: critério i em Bom e referência em Neutro; ação B: i em Neutro e referência em Bom. Se B ≻ A, piore a referência em B até a indiferença: informe o valor (pontos, escala Neutro=0/Bom=100) da referência nesse ponto. Então w<sub>i</sub> = w<sub>ref</sub> · valor/100.</p>

${pp.trade.ref?(()=>{const r=no(pp.trade.ref);const tbl=isLeaf(r)&&transf(r)?`<div class="hint">Escala de “${esc(r.nome)}”: ${dsc(r).niveis.map(l=>`${esc(l.rot||'')}=${f(lvVal(r,l.id),0)}`).join(' · ')}</div>`:'';return tbl+`<table>${ch.filter(c=>c.id!==pp.trade.ref).map(c=>`<tr><td>${esc(c.nome)} ~ referência em</td><td><input type="number" step="any" value="${pp.trade.v[c.id]??''}" onchange="setP('${base}.trade.v.${c.id}',pn(this.value),false)"> pontos</td></tr>`).join('')}</table>`;})():''}`:''}
${pp.metodo==='mac'?`<p class="hint">Ações fictícias A<sub>i</sub> (critério i em Bom, demais em Neutro) e A0 (todos em Neutro), ordenadas pela matriz acima. Julgue a perda de atratividade ao trocar a linha pela coluna.</p>
${macMatrix([...ordemFilhos(pid).map(id=>({id})),{id:'A0'}],base+'.mac',pp.mac,x=>x.id==='A0'?'A0':'A['+no(x.id).nome+']')}`:''}
${pp.metodo!=='direto'?`<div class="row"><button class="p" onclick="calcPesos('${pid}')">Calcular e aplicar</button></div>`:''}</div>
<div class="card"><h3>Taxas globais das folhas</h3><table>${folhas().map(n=>`<tr><td>${esc(caminho(n.id))}</td><td class="num">${f(gw(n.id)*100,2)}%</td></tr>`).join('')}</table></div>
</div></div>`;};

function perfInput(a,n){const c=cell(a.id,n.id)||{};const p=`desempenho.${a.id}.${n.id}`;const d=dsc(n);const lvs=d.niveis.map((l,k)=>[l.id,'N'+(k+1)+' '+(l.rot||'')]).reverse();
 if(isCont(n)){const r=pn(c.x)!=null?interp(ptsQuanti(n),pn(c.x)):null;return`<input type="number" step="any" value="${c.x??''}" onchange="setP('${p}.x',pn(this.value))">${S.ui.faixa?`<input type="number" step="any" placeholder="alt." value="${c.x2??''}" onchange="setP('${p}.x2',pn(this.value))">`:''}${r&&r.fora?'<div class="tag o">fora da faixa</div>':''}`;}
 return`<select onchange="setP('${p}.lv',this.value)">${opt([['','—'],...lvs],c.lv)}</select>${S.ui.faixa?`<select onchange="setP('${p}.lv2',this.value)">${opt([['','(alt.) —'],...lvs],c.lv2)}</select>`:''}`;}

function dominancias(){const L=folhas(),A=S.acoes,r=[];A.forEach(a=>A.forEach(b=>{if(a===b)return;let ge=true,gt=false;for(const n of L){const va=vLocal(n,a.id),vb=vLocal(n,b.id);if(va==null||vb==null){ge=false;break;}if(va<vb){ge=false;break;}if(va>vb)gt=true;}if(ge&&gt)r.push([a.nome,b.nome]);}));return r;}
P.avaliacao=()=>{const L=folhas(),A=S.acoes,I=internos().filter(n=>n.id!=='root');if(!A.length||!L.length)return`<h2>13. Avaliação das ações</h2><p class="hint">Cadastre ações e árvore com descritores.</p>`;
 if(!S.ui.perfilSel.length)S.ui.perfilSel=A.slice(0,2).map(a=>a.id);const rank=A.map(a=>({a,v:V(a.id)})).sort((x,y)=>(y.v??-1e9)-(x.v??-1e9));const dom=dominancias();
 return`<h2>13. Avaliação das ações potenciais</h2><p class="hint">Avaliação local (performance em cada descritor → valor da função), perfil de impacto e avaliação global pela fórmula de agregação aditiva V(a) = Σ w<sub>i</sub>·v<sub>i</sub>(a). Descritores quantitativos contínuos usam interpolação linear.</p>
<div class="card"><div class="row"><h3 style="margin:0">Tabela de desempenho</h3><label style="color:var(--ink)"><input type="checkbox" ${S.ui.faixa?'checked':''} onchange="setP('ui.faixa',this.checked)"> impacto não pontual (valor alternativo / faixa)</label></div>
<div class="scroll"><table><tr><th>Ação</th>${L.map(n=>`<th title="${esc(caminho(n.id))}">${esc(n.nome)}${isCont(n)?` <small>(${esc(dsc(n).unid)})</small>`:''}</th>`).join('')}</tr>
${A.map(a=>`<tr><td><b>${esc(a.nome)}</b></td>${L.map(n=>`<td style="min-width:110px">${perfInput(a,n)}</td>`).join('')}</tr>`).join('')}</table></div></div>

${A.map(a=>{const rj=rejeitada(a.id);return`<tr><td><b>${esc(a.nome)}</b>${rj.length?`<br><span class="tag r">rejeitada: ${esc(rj.join(', '))}</span>`:''}</td>${L.map(n=>{const v=vLocal(n,a.id);return`<td class="num ${vcls(v)}">${f(v)}</td>`;}).join('')}${I.map(n=>{const v=nodeVal(n.id,a.id);return`<td class="num ${vcls(v)}" style="background:#f7f9fc">${f(v)}</td>`;}).join('')}<td class="num"><b>${f(V(a.id))}</b></td>${S.ui.faixa?`<td class="num">${f(V(a.id,'min'))} – ${f(V(a.id,'max'))}</td>`:''}</tr>`;}).join('')}</table></div>

<table>${rank.map((r,k)=>`<tr><td>${k+1}º</td><td>${esc(r.a.nome)}</td><td class="num">${f(r.v,1)}</td></tr>`).join('')}</table></div>

<div class="card"><h3>Perfil de impacto (identifique oportunidades de aperfeiçoamento)</h3><div class="row">${A.map(a=>`<label style="color:var(--ink);display:inline"><input type="checkbox" ${S.ui.perfilSel.includes(a.id)?'checked':''} onchange="S.ui.perfilSel=${JSON.stringify([])}.concat([...document.querySelectorAll('[data-pf]:checked')].map(x=>x.dataset.pf));commit()" data-pf="${a.id}"> ${esc(a.nome)}</label>`).join(' ')}</div>
${lineChart(L.map(n=>n.nome),A.filter(a=>S.ui.perfilSel.includes(a.id)).map(a=>({n:a.nome,c:PAL[A.indexOf(a)%PAL.length],y:L.map(n=>vLocal(n,a.id))})),{rot:true,h:400})}
${A.filter(a=>S.ui.perfilSel.includes(a.id)).map(a=>{const low=L.filter(n=>{const v=vLocal(n,a.id);return v!=null&&v<=0;});return low.length?`<div class="msg warn"><b>${esc(a.nome)}</b> — pontos em ou abaixo do Neutro: ${low.map(n=>esc(n.nome)).join(', ')}.</div>`:'';}).join('')}</div>`;};

/* ---------------- 14. Custo × benefício ---------------- */
function grupoVal(ids,aid,op){let s=0,w=0;for(const id of ids){const g=gw(id),v=nodeVal(id,aid,'nom',null,op);if(v==null)return null;s+=g*v;w+=g;}return w?s/w:null;}
function pacoteRes(pk){const n=no(pk.folha),a=S.acoes.find(x=>x.id===pk.acao);if(!n||!a)return null;const cellNew=isCont(n)?{x:pk.x}:{lv:pk.lv};const op={leaf:n.id,acao:a.id,cell:cellNew};
 const b0=grupoVal(S.cb.beneficios,a.id),b1=grupoVal(S.cb.beneficios,a.id,op),v0=V(a.id),v1=V(a.id,'nom',null,op);return{b0,b1,v0,v1,db:b1-b0,dv:v1-v0,cpp:(pn(pk.custo)||0)/((b1-b0)||NaN)};}
P.custobeneficio=()=>{const A=S.acoes,ns=dfs().map(x=>x.n).filter(n=>n.id!=='root');const C=S.cb.custos,B=S.cb.beneficios;
 const tog=(k,id)=>`<input type="checkbox" ${S.cb[k].includes(id)?'checked':''} onchange="(S.cb.${k}=this.checked?[...S.cb.${k},'${id}']:S.cb.${k}.filter(x=>x!=='${id}'));commit()">`;
 const pts=C.length&&B.length?A.map(a=>({l:a.nome,x:grupoVal(C,a.id),y:grupoVal(B,a.id)})).filter(p=>p.x!=null&&p.y!=null):[];pts.forEach(p=>p.ef=!pts.some(q=>q!==p&&q.x>=p.x&&q.y>=p.y&&(q.x>p.x||q.y>p.y)));
 return`<h2>14. Análise custo × benefício</h2><p class="hint">Agrupe os critérios em Custos e Benefícios (não sobrepostos). Ações fora da fronteira eficiente são dominadas. Eixo X: atratividade em custos (maior = mais barato).</p>

${pts.length?`<div class="card">${scatter(pts,'Custos (atratividade)','Benefícios',pts.filter(p=>p.ef))}<p>Eficientes: ${pts.filter(p=>p.ef).map(p=>`<span class="tag g">${esc(p.l)}</span>`).join('')} · Dominadas: ${pts.filter(p=>!p.ef).map(p=>`<span class="tag r">${esc(p.l)}</span>`).join('')||'—'}</p></div>`:''}

${S.cb.pacotes.map((pk,i)=>{const n=no(pk.folha);const r=pacoteRes(pk);const base=`cb.pacotes.${i}`;return`<tr><td><select onchange="setP('${base}.acao',this.value)">${opt([['','—'],...A.map(a=>[a.id,a.nome])],pk.acao)}</select></td><td><select onchange="setP('${base}.folha',this.value)">${opt([['','—'],...folhas().map(n=>[n.id,n.nome])],pk.folha)}</select></td>
<td>${n?isCont(n)?`<input type="number" step="any" value="${pk.x??''}" onchange="setP('${base}.x',pn(this.value))">`:`<select onchange="setP('${base}.lv',this.value)">${opt([['','—'],...dsc(n).niveis.map((l,k)=>[l.id,'N'+(k+1)+' '+l.rot]).reverse()],pk.lv)}</select>`:''}</td>
<td><input type="number" value="${pk.custo??''}" onchange="setP('${base}.custo',pn(this.value))"></td><td class="num">${r?f(r.db,2):''}</td><td class="num">${r?f(r.dv,2):''}</td><td class="num"><b>${r&&isFinite(r.cpp)?f(r.cpp,2):''}</b></td><td><button class="s x" onclick="delP('cb.pacotes',${i})">✕</button></td></tr>`;}).join('')}</table>
<div class="row"><button onclick="S.cb.pacotes.push({acao:'',folha:'',custo:0});commit()">+ Pacote</button></div></div>`;};

/* ---------------- 15. Sensibilidade ---------------- */
function ovPara(id,wp){const n=no(id),sib=filhos(n.pai),wcur=wn(n),ov={};sib.forEach(s=>{if(s.id===id)ov[s.id]=wp;else ov[s.id]=wcur<1?wn(s)*(1-wp)/(1-wcur):(1-wp)/(sib.length-1);});return ov;}

 if(!n||!A.length)return`<h2>15. Análise de sensibilidade</h2><p class="hint">Necessário ter ações avaliadas e critérios com irmãos.</p>`;
 const w=wn(n),steps=[...Array(21)].map((_,k)=>k/20);const series=A.map((a,k)=>({n:a.nome,c:PAL[k%PAL.length],y:steps.map(s=>V(a.id,'nom',ovPara(n.id,s)))}));
 const sw=[];let prev=null;for(let k=0;k<=1000;k++){const s=k/1000;const best=A.map(a=>[a,V(a.id,'nom',ovPara(n.id,s))]).sort((x,y)=>(y[1]??-1e9)-(x[1]??-1e9))[0];if(best&&prev&&best[0]!==prev)sw.push([s,prev.nome,best[0].nome]);prev=best&&best[0];}
 const pct=(+S.sens.pct||10)/100;const cols=[['Original',w],[`+${S.sens.pct}%`,Math.min(1,w*(1+pct))],[`−${S.sens.pct}%`,Math.max(0,w*(1-pct))]];
 const tabs=cols.map(([t,wp])=>{const ov=ovPara(n.id,wp);return{t,wp,r:A.map(a=>({a,v:V(a.id,'nom',ov)})).sort((x,y)=>(y.v??-1e9)-(x.v??-1e9))};});
 const chg=tabs.slice(1).some(tb=>tb.r.map(x=>x.a.id).join()!==tabs[0].r.map(x=>x.a.id).join());
 return`<h2>15. Análise de sensibilidade</h2><p class="hint">Varia-se a taxa do critério escolhido; as dos irmãos são recalculadas mantendo suas proporções: w′<sub>n</sub> = w<sub>n</sub>(1−w′<sub>i</sub>)/(1−w<sub>i</sub>) (Anexo 11A). Um modelo robusto não muda a ordem para variações de ~10%.</p>
<div class="card row">Critério: <select onchange="setP('sens.no',this.value)">${opt(cand.map(c=>[c.id,caminho(c.id)]),S.sens.no)}</select> Variação: <input type="number" value="${S.sens.pct}" onchange="setP('sens.pct',pn(this.value))">% <span class="tag">taxa atual ${f(w*100,2)}%</span></div>

/* ---------------- 16. ELECTRE (Roy) ---------------- */
function royCrit(){if(S.electre.nivel==='folhas')return folhas();const out=[];const rec=id=>{filhos(id).forEach(c=>{if(c.tipo==='PVF'||isLeaf(c))out.push(c);else rec(c.id);});};rec('root');return out;}
function rp(c){const d=S.electre.crit[c.id]||{};return{k:pn(d.k)??+(gw(c.id)*100).toFixed(2),q:pn(d.q)??0,p:pn(d.p)??0,v:pn(d.v)};}
function royMats(G,crit){const n=G.length;const C=[],D=[],Sg=[];const K=crit.reduce((s,c)=>s+rp(c).k,0)||1;
 for(let i=0;i<n;i++){C[i]=[];D[i]=[];Sg[i]=[];for(let j=0;j<n;j++){if(i===j){C[i][j]=1;D[i][j]=[];Sg[i][j]=1;continue;}let cs=0;const dj=[];
  crit.forEach((c,k)=>{const{k:kk,q,p,v}=rp(c);const diff=G[j][k]-G[i][k];const pp=Math.max(p,q);const cj=diff<=q?1:diff>=pp?0:(pp-diff)/(pp-q);cs+=kk*cj;
   let d=0;if(v!=null){d=diff>=v?1:diff<=pp?0:(diff-pp)/(v-pp);}dj.push(d);});
  C[i][j]=cs/K;D[i][j]=dj;let s=C[i][j];dj.forEach(d=>{if(d>C[i][j]&&C[i][j]<1)s*=(1-d)/(1-C[i][j]);});if(dj.some(d=>d>=1))s=0;Sg[i][j]=s;}}return{C,D,Sg};}
function outGraph(names,R){const w=520,h=420,cx=w/2,cy=h/2,r=150,n=names.length;const P2=names.map((_,i)=>[cx+r*Math.cos(2*Math.PI*i/n-Math.PI/2),cy+r*Math.sin(2*Math.PI*i/n-Math.PI/2)]);let b='';
 for(let i=0;i<n;i++)for(let j=0;j<n;j++){if(i===j||!R[i][j])continue;if(R[j][i]&&j<i)continue;const[a,c]=[P2[i],P2[j]];const dx=c[0]-a[0],dy=c[1]-a[1],L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;
  const x1=a[0]+ux*22,y1=a[1]+uy*22,x2=c[0]-ux*22,y2=c[1]-uy*22;b+=R[j][i]?`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#2b8a3e" stroke-width="2.5"/>`:`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>`;}
 names.forEach((t,i)=>{b+=`<circle cx="${P2[i][0]}" cy="${P2[i][1]}" r="20" fill="#e8f0fc" stroke="#1f5fbf"/><text x="${P2[i][0]}" y="${P2[i][1]+4}" text-anchor="middle" font-size="11">${esc(t.slice(0,8))}</text>`;});
 return svgWrap(w,h,b+`<text x="10" y="${h-10}" font-size="11" fill="#666">→ a S b (não b S a) · verde: indiferença (a S b e b S a)</text>`);}
function kernelOf(A,R){const ids=A.map((_,i)=>String(i)),out={};ids.forEach(i=>out[i]=ids.filter(j=>j!==i&&R[+i][+j]));return nucleo(ids,out);}
P.electre=()=>{const A=S.acoes,crit=royCrit(),E=S.electre;const G=A.map(a=>crit.map(c=>nodeVal(c.id,a.id)));
 const miss=G.some(r=>r.some(v=>v==null));const cats=S.problematica.categorias;while(E.perfis.length<Math.max(0,cats.length-1))E.perfis.push({});
 let body='';if(A.length>=2&&!miss){const{C,D,Sg}=royMats(G,crit);const n=A.length;const R=C.map((r,i)=>r.map((c,j)=>i!==j&&c>=E.s&&!D[i][j].some(d=>d>=1)));
  let nI=0,nP=0,nR=0;for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){if(R[i][j]&&R[j][i])nI++;else if(R[i][j]||R[j][i])nP++;else nR++;}
  const ker=kernelOf(A,R);const sym=(i,j)=>i===j?'—':R[i][j]&&R[j][i]?'I':R[i][j]?'P':R[j][i]?'P⁻¹':'R';
  const rob=[];for(let s=0.5;s<=0.951;s+=0.05){const Rs=C.map((r,i)=>r.map((c,j)=>i!==j&&c>=s-1e-9&&!D[i][j].some(d=>d>=1)));rob.push([s,kernelOf(A,Rs)]);}
  const RL=Sg.map((r,i)=>r.map((s,j)=>i!==j&&s>=E.lambda));const qual=A.map((a,i)=>({a,q:RL[i].filter(Boolean).length-RL.map(r=>r[i]).filter(Boolean).length})).sort((x,y)=>y.q-x.q);
  let tri='';if(cats.length>=2){const B=E.perfis.map(pf=>crit.map(c=>pn(pf[c.id])));if(B.some(r=>r.some(v=>v==null)))tri='<div class="msg warn">Preencha todos os perfis.</div>';else{
   const sig=(ga,gb)=>{const{C:c2,D:d2,Sg:s2}=royMats([ga,gb],crit);return[s2[0][1],s2[1][0]];};
   tri=`<table><tr><th>Ação</th><th>Pessimista</th><th>Otimista</th></tr>${A.map((a,i)=>{let pes=0,oti=cats.length-1;for(let h=B.length-1;h>=0;h--){if(sig(G[i],B[h])[0]>=E.lambda){pes=h+1;break;}}
    for(let h=0;h<B.length;h++){const[ab,ba]=sig(G[i],B[h]);if(ba>=E.lambda&&ab<E.lambda){oti=h;break;}}return`<tr><td>${esc(a.nome)}</td><td><span class="tag">${esc(cats[pes].nome)}</span></td><td><span class="tag">${esc(cats[oti].nome)}</span></td></tr>`;}).join('')}</table>`;}}
  body=`<div class="card"><h3>ELECTRE I — escolha (P.α)</h3><div class="grid2"><div><h4>Índice de concordância C(a,b)</h4><div class="scroll"><table class="mat"><tr><th>a \\ b</th>${A.map(a=>`<th>${esc(a.nome)}</th>`).join('')}</tr>${A.map((a,i)=>`<tr><th>${esc(a.nome)}</th>${A.map((b,j)=>`<td style="${i!==j&&C[i][j]>=E.s?'background:#e3f4e8':''}">${i===j?'—':f(C[i][j],3)}</td>`).join('')}</tr>`).join('')}</table></div>
  <h4>Discordância (veto atingido)</h4><div class="scroll"><table class="mat"><tr><th>a \\ b</th>${A.map(a=>`<th>${esc(a.nome)}</th>`).join('')}</tr>${A.map((a,i)=>`<tr><th>${esc(a.nome)}</th>${A.map((b,j)=>`<td>${i===j?'—':D[i][j].map((d,k)=>d>=1?crit[k].nome:'').filter(Boolean).join(', ')||'·'}</td>`).join('')}</tr>`).join('')}</table></div>
  <h4>Sistema de relações (BSOR S, R)</h4><div class="scroll"><table class="mat"><tr><th></th>${A.map(a=>`<th>${esc(a.nome)}</th>`).join('')}</tr>${A.map((a,i)=>`<tr><th>${esc(a.nome)}</th>${A.map((b,j)=>`<td>${sym(i,j)}</td>`).join('')}</tr>`).join('')}</table></div>
  <p>Pares: <span class="tag g">I = ${nI}</span> <span class="tag">P = ${nP}</span> <span class="tag o">R (incomparáveis) = ${nR}</span></p></div>
  <div>${outGraph(A.map(a=>a.nome),R)}<div class="msg ok"><b>Núcleo (A′ recomendado):</b> ${ker.kernel.map(c=>c.map(i=>A[+i].nome).join(' ~ ')).join(' · ')}</div>${ker.ciclos.length?`<div class="msg warn">Circuitos (tratados como classe única): ${ker.ciclos.map(c=>c.map(i=>A[+i].nome).join(', ')).join(' | ')}</div>`:''}</div></div></div>
  <div class="card"><h3>Robustez da recomendação (variação do limiar de concordância s)</h3><p class="hint">Roy (12.5): busque “quase-invariantes” — conclusões que se mantêm para a maioria das combinações de parâmetros.</p><table><tr><th>s</th><th>Núcleo</th></tr>${rob.map(([s,k])=>`<tr><td>${f(s,2)}</td><td>${k.kernel.map(c=>c.map(i=>A[+i].nome).join(' ~ ')).join(' · ')}</td></tr>`).join('')}</table></div>
  <div class="card"><h3>Credibilidade σ(a,b) (ELECTRE III) e ordenação por qualificação (P.γ)</h3><p class="hint">σ = C·Π<sub>j: d<sub>j</sub>>C</sub>(1−d<sub>j</sub>)/(1−C), com discordância linear entre p<sub>j</sub> e v<sub>j</sub>. Corte λ = ${E.lambda}. Qualificação = nº de ações que a sobreclassifica − nº de ações que a sobreclassificam.</p>
  <div class="scroll"><table class="mat"><tr><th>a \\ b</th>${A.map(a=>`<th>${esc(a.nome)}</th>`).join('')}</tr>${A.map((a,i)=>`<tr><th>${esc(a.nome)}</th>${A.map((b,j)=>`<td style="${i!==j&&Sg[i][j]>=E.lambda?'background:#e3f4e8':''}">${i===j?'—':f(Sg[i][j],3)}</td>`).join('')}</tr>`).join('')}</table></div>
  <table style="margin-top:8px">${qual.map((x,k)=>`<tr><td>${k+1}º</td><td>${esc(x.a.nome)}</td><td class="num">${x.q}</td></tr>`).join('')}</table></div>
  <div class="card"><h3>ELECTRE TRI — alocação em categorias (P.β)</h3>${cats.length<2?'<p class="hint">Defina ≥2 categorias na página Problemática.</p>':`<p class="hint">Perfis b<sub>h</sub> separam a categoria h da h+1 (valores na escala de cada critério). Pessimista: primeira b<sub>h</sub> (de cima) tal que a S b<sub>h</sub>. Otimista: primeira b<sub>h</sub> (de baixo) tal que b<sub>h</sub> ≻ a.</p>
  <div class="scroll"><table><tr><th>Perfil</th>${crit.map(c=>`<th>${esc(c.nome)}</th>`).join('')}</tr>${E.perfis.slice(0,cats.length-1).map((pf,h)=>`<tr><td>b${h+1}: ${esc(cats[h].nome)} | ${esc(cats[h+1].nome)}</td>${crit.map(c=>`<td><input type="number" step="any" value="${pf[c.id]??''}" onchange="setP('electre.perfis.${h}.${c.id}',pn(this.value))"></td>`).join('')}</tr>`).join('')}</table></div>${tri}`}</div>`;}
 else body=`<div class="msg warn">São necessárias ≥2 ações com avaliação completa nos critérios selecionados.</div>`;
 return`<h2>16. Complemento de Roy — sobreclassificação (ELECTRE)</h2><p class="hint">Abordagem operacional 2 (Roy, 11.3): sínteses por sobreclassificação que admitem incomparabilidade (R) e pseudo-critérios com limiares de indiferença q, preferência p (indiferença se Δ ≤ q, preferência fraca Q se q &lt; Δ ≤ p, estrita P se Δ &gt; p) e veto v. Os critérios usam os valores (escala Neutro=0/Bom=100) do modelo MCDA-C.</p>

<table><tr><th>Critério</th><th>Importância k</th><th>q (indiferença)</th><th>p (preferência)</th><th>v (veto)</th><th>Tipo</th></tr>${crit.map(c=>{const r=rp(c);const b=`electre.crit.${c.id}`;return`<tr><td>${esc(c.nome)}</td><td><input type="number" step="any" value="${r.k}" onchange="setP('${b}.k',pn(this.value))"></td><td><input type="number" step="any" value="${r.q}" onchange="setP('${b}.q',pn(this.value))"></td><td><input type="number" step="any" value="${r.p}" onchange="setP('${b}.p',pn(this.value))"></td><td><input type="number" step="any" value="${r.v??''}" placeholder="sem" onchange="setP('${b}.v',pn(this.value))"></td><td><span class="tag">${r.q===0&&r.p===0?'verdadeiro critério':r.q===r.p?'semi-critério':r.q===0?'pré-critério':'pseudo-critério'}</span></td></tr>`;}).join('')}</table>
<p class="hint">k padrão = taxa global (%). Os k aqui são coeficientes de importância (votos), não taxas de substituição.</p></div>${body}`;};
